<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-label="Azure Monitor: Be Told Before You Are Asked">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#022c22"/><stop offset="1" stop-color="#065f46"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#fde047" stop-opacity=".28"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="346" rx="18" fill="url(#bg)"/><rect width="1000" height="346" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#fde047" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#fde047" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Azure Monitor: Be Told</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Before You Are Asked</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Beanie&#x27;s receipts live in one Azure storage account, and when it is</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">hammered, or when somebody deletes it, nobody is told. Azure Monitor</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">can tell the right people, but only if you wire four things together:</text>
<text x="48" y="256" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">who to tell (an action group), when (a metric alert), what is rare but…</text>
<rect x="48" y="288" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fde047" stroke-opacity=".7"/><text x="62" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">75-90 min</text>
<rect x="165" y="288" width="552" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fde047" stroke-opacity=".7"/><text x="179" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free (a storage account and two alert rules cost cents)</text>
<g transform="translate(750,73)">
<circle cx="110" cy="100" r="30" fill="none" stroke="#fde047" stroke-opacity=".35"/>
<circle cx="110" cy="100" r="60" fill="none" stroke="#fde047" stroke-opacity=".35"/>
<circle cx="110" cy="100" r="90" fill="none" stroke="#fde047" stroke-opacity=".35"/>
<path d="M110 100 L110 10 A90 90 0 0 1 172 36 Z" fill="#fde047" opacity=".35"><animateTransform attributeName="transform" type="rotate" from="0 110 100" to="360 110 100" dur="4s" repeatCount="indefinite"/></path>
<circle cx="150" cy="60" r="5" fill="#fde047" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="70" cy="120" r="5" fill="#fde047" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
<circle cx="140" cy="140" r="5" fill="#fde047" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.6s" repeatCount="indefinite"/></circle>
</g>
</svg>